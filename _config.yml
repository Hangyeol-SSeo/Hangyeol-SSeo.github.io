        quote: >
          아이디어 기획과 MVP 출시부터 시작하여 유저 피드백을 바탕으로 매주 2~3개의 기능 구현/수정 사항을 배포
        description: | # this will include new lines to allow paragraphs
          - <mark>시드투자 1억원</mark> - 코코네 one
          - <mark>MAU 1000명 이상, 월간 매출 300만원 이상 달성</mark>
          - <mark>KBS/EBS</mark> 뉴스 방영
          - <mark>학생창업유망팀 300+</mark> 선정
          - <mark>NextRise 2024</mark> 참가 - <mark>모의투자 2등</mark>

          ### 주요 업무

          *Sendbird*, *Datadog*, *Firebase(GA4)*, *Mixpanel*, *Meta pixel*등 **SaaS 도입** <br/>
          → Datadog Funnel Analysis & Mixpanel 활용하여 가입 이탈 개선, **가입 전환율 30% -> 65% 개선**
          
          **EAS update(Code push) 구현** 및 업데이트 옵션 세분화 <br/>
          → build & 심사 과정 **3~4일** -> 배포까지 **10분**으로 단축
        
          EAS, Sendbird의 **foreground**, **background** **알림 핸들링**
          
          **Expo SDK version migration** 작업
          
          **JWT 인증**, **자동 로그인** 구현 <br/>
          → 자동 로그인 기능 개발 후 **이탈률 5% 개선**

          React-Native를 이용한 **Android & iOS 인앱 결제** 구현 - **소모품**, **구독 상품**
          
          Native navigation 스택 구성 및 이동 구현

          **서버리스 마케팅 어트리뷰션 시스템** 구축 <br/>
          → **AWS Lambda + API Gateway** 기반 UTM 파라미터 자동 수집 시스템 개발 <br/>
          → 마케팅 채널별 전환율 대시보드 구축으로 **광고 효율 개선에 기여**

