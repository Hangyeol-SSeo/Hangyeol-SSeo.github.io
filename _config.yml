          외부 라이브러리 없이 Vanilla JavaScript만으로 네이버 API와 네트워크를 직접 분석하여 구현했으며, 화질 선택과 탭별 독립 동작을 지원합니다.

      - layout: left
        title: APRO - 조기축구 실력 맞춤 매칭 플랫폼
        sub_title: 예비창업(팀)
        caption: 2023.11 ~ 2024.07
        link: /experience/apro/
        link_text: 상세 정보 →
        quote: >
          가설설정, 아이디어 검증, 실행, 피드백까지 창업 과정 flow를 경험. 랜딩페이지 배포를 위한 서버 구축 및 로그 수집.
        description: | # this will include new lines to allow paragraphs
          - 2024 <mark>안산대학교 아이디어 사업화 지원사업 선정</mark>

          ### 주요 업무

          조기축구 동호인들이 실력이 맞는 상대를 찾기 어렵다는 문제를 발견하고, 직접 창업에 도전한 프로젝트입니다. 
          아이디어를 제품으로 만들기 전, 가설 설정 → 검증 → 실행 → 피드백 의 과정을 반복하며 시장과 고객을 먼저 이해하려 했습니다.
          
          랜딩페이지를 활용한 가짜 문 프리토타이핑으로 접속자 500명 중 44.7%의 응답을 이끌어내 문제의 실재를 확인했고, 공인 심판을 직접 섭외해 5경기를 실험하고 약 60팀을 현장 인터뷰하며 솔루션을 검증했습니다. 
          결과적으로 비즈니스 모델의 한계를 발견하고 프로젝트를 마무리했지만, 이 과정에서 고객이 원하는 것을 데이터와 현장으로 검증하는 태도를 체화했습니다.

