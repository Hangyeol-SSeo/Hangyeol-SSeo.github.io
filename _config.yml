about_content: | # this will include new lines to allow paragraphs
  지난 2년간 학생 창업을 시작으로 2개의 스타트업에서 개발자로 일하며 MAU 1000명 이상의 서비스를 운영해 본 경험이 있는 연쇄 창업가입니다.
  
  JavaScript를 기반으로 한 프레임워크들을 활용하여 웹 & 앱 프론트엔드를 구축해 본 경험이 있으며, 
  Google-Analytics, Mixpanel, Datadog등을 활용하여 데이터를 수집, 분석하고 이를 활용해 필요한 지표들을 개선했습니다.
  
  항상 비즈니스를 우선시하며, 고객의 니즈를 파악하고 그것을 어떻게 해결할지 고민하는 것을 좋아하는 개발자입니다.
  데이터를 기반으로 KPI를 개선하고, 고객과 소통하여 pain point를 찾아내 필요한 기능을 스스로 동기부여 하며 개발할 때 가장 큰 즐거움을 느낍니다. 


